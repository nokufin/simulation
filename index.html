<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Creature Simulation</title>
        <link rel="stylesheet" href="./style.css" />
    </head>
    <body>
        <main class="app">
            <header class="app__header">
                <h1>Creature Simulation</h1>

                <div class="toolbar">
                    <div class="btn-group" id="simControls">
                        <button
                            type="button"
                            id="pauseBtn"
                            aria-label="pause / play"
                        >
                            <svg
                                class="icon icon--pause"
                                viewBox="0 0 16 16"
                                width="12"
                                height="12"
                            >
                                <rect x="3" y="2" width="4" height="12" />
                                <rect x="9" y="2" width="4" height="12" />
                            </svg>
                            <svg
                                class="icon icon--play"
                                viewBox="0 0 16 16"
                                width="12"
                                height="12"
                            >
                                <path d="M4 2 L13 8 L4 14 Z" />
                            </svg>
                        </button>
                        <button type="button" id="stepBtn">step</button>
                    </div>

                    <div class="btn-group" id="speed">
                        <button type="button" data-speed="1" class="is-active">
                            1&times;
                        </button>
                        <button type="button" data-speed="2">2&times;</button>
                        <button type="button" data-speed="4">4&times;</button>
                        <button type="button" data-speed="10">10&times;</button>
                    </div>
                </div>

                <dl id="simInfo" class="sim-info"></dl>
            </header>

            <div class="stage">
                <canvas id="myCanvas" width="1280" height="600"></canvas>

                <aside class="panel panel--narrow">
                    <h2 class="panel__title">Food</h2>
                    <div id="foodInfo" class="panel__body"></div>
                </aside>
            </div>

            <section class="creatures">
                <h2 class="panel__title">Creatures</h2>
                <div id="creatureInfo" class="creatures__row"></div>
            </section>
        </main>

        <script type="module" src="./main.js"></script>
    </body>
</html>
