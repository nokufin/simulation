<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Creature Simulation</title>
        <link rel="stylesheet" href="./style.css" />
    </head>
    <body>
        <main class="app">
            <header class="app__header">
                <h1>Creature Simulation</h1>

                <div class="toolbar">
                    <div class="btn-group" id="simControls">
                        <button
                            type="button"
                            id="pauseBtn"
                            aria-label="pause / play"
                        >
                            <svg
                                class="icon icon--pause"
                                viewBox="0 0 16 16"
                                width="12"
                                height="12"
                            >
                                <rect x="3" y="2" width="4" height="12" />
                                <rect x="9" y="2" width="4" height="12" />
                            </svg>
                            <svg
                                class="icon icon--play"
                                viewBox="0 0 16 16"
                                width="12"
                                height="12"
                            >
                                <path d="M4 2 L13 8 L4 14 Z" />
                            </svg>
                        </button>
                        <button type="button" id="stepBtn">step</button>
                    </div>

                    <div class="btn-group" id="speed">
                        <button type="button" data-speed="1" class="is-active">
                            1&times;
                        </button>
                        <button type="button" data-speed="2">2&times;</button>
                        <button type="button" data-speed="4">4&times;</button>
                        <button type="button" data-speed="10">10&times;</button>
                    </div>
                </div>

                <dl id="simInfo" class="sim-info"></dl>
            </header>

            <div class="stage">
                <!-- Creature Explorer: az élőlények kompakt, görgethető listája -->
                <aside class="explorer" id="explorer">
                    <div class="explorer__head">
                        <h2 class="panel__title">Lények</h2>
                        <button
                            type="button"
                            id="explorerToggle"
                            class="explorer__toggle"
                            aria-expanded="true"
                            aria-controls="explorerContent"
                            aria-label="Lénylista összecsukása"
                            title="Lénylista összecsukása"
                        >
                            <span aria-hidden="true">‹</span>
                        </button>
                    </div>
                    <div class="explorer__content" id="explorerContent">
                        <input
                            type="search"
                            id="explorerSearch"
                            class="explorer__search"
                            placeholder="Keresés: #42"
                            aria-label="Lény keresése azonosító alapján"
                            inputmode="numeric"
                            autocomplete="off"
                        />
                        <p class="explorer__count" id="explorerCount" aria-live="polite"></p>
                        <!-- fajcsoportok: fejléc (nyit / csuk) + az élő egyedek sorai -->
                        <div
                            class="explorer__list"
                            id="explorerList"
                            role="listbox"
                            tabindex="0"
                            aria-multiselectable="true"
                            aria-label="Élőlények fajonként (nyilakkal léptethető, Ctrl + kattintás: többes kijelölés)"
                        ></div>
                    </div>
                </aside>

                <!-- a felbontást a main.js állítja be a config.js alapján -->
                <canvas id="myCanvas"></canvas>

                <aside class="side">
                    <section class="panel--narrow panel--population">
                        <h2 class="panel__title">Population</h2>
                        <div class="pop">
                            <canvas id="popChart" class="pop__chart" width="380" height="140"></canvas>
                            <div class="pop__legend">
                                <span class="pop__key pop__key--alive">alive</span>
                                <span class="pop__key pop__key--gen">avg gen</span>
                            </div>
                            <dl id="popInfo" class="pop__stats"></dl>
                        </div>
                    </section>

                    <section class="panel--narrow panel--food">
                        <h2 class="panel__title">Food</h2>
                        <div id="foodInfo" class="panel__body"></div>
                    </section>
                </aside>
            </div>

            <!-- egyetlen panel a kijelölt lénynek (nem kártya minden lényhez) -->
            <section class="inspector" id="inspector">
                <div class="inspector__head">
                    <h2 class="panel__title" id="inspectorTitle">Kijelölt lény</h2>
                    <!-- visszafogott tájékoztatás, pl. ha elérted a kijelölési korlátot -->
                    <p class="inspector__hint" id="selectionNotice" role="status" aria-live="polite"></p>
                    <button type="button" id="deselectBtn" class="inspector__close" hidden>
                        kijelölés megszüntetése (Esc)
                    </button>
                </div>
                <div id="inspectorBody" class="inspector__body"></div>
            </section>
        </main>

        <script type="module" src="./main.js"></script>
    </body>
</html>
