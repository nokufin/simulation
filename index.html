<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Creature Simulation</title>
        <link rel="stylesheet" href="./style.css" />
    </head>
    <body>
        <main class="app">
            <header class="app__header">
                <h1>Creature Simulation</h1>
                <dl id="simInfo" class="sim-info"></dl>
            </header>

            <div class="stage">
                <canvas id="myCanvas" width="1280" height="600"></canvas>

                <aside class="panel panel--narrow">
                    <h2 class="panel__title">Food</h2>
                    <div id="foodInfo" class="panel__body"></div>
                </aside>
            </div>

            <section class="creatures">
                <h2 class="panel__title">Creatures</h2>
                <div id="creatureInfo" class="creatures__row"></div>
            </section>
        </main>

        <script type="module" src="./main.js"></script>
    </body>
</html>
